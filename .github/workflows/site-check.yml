name: Jekyll build and browser QA
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build GitHub Pages
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Verify generated site and internal routes
        run: python3 .github/scripts/check_site.py _site
      - name: Install Playwright and Chromium in an isolated directory
        run: |
          mkdir -p /tmp/portfolio-playwright
          cd /tmp/portfolio-playwright
          npm init -y
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
          ln -s /tmp/portfolio-playwright/node_modules "$GITHUB_WORKSPACE/node_modules"
      - name: Run responsive browser smoke tests
        run: |
          mkdir -p artifacts/preview
          python3 -m http.server 4173 --directory _site >/tmp/portfolio-preview-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          node .github/scripts/visual_smoke.mjs artifacts/preview
      - name: Upload desktop, tablet and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-preview
          path: artifacts/preview/*.png
          if-no-files-found: warn
